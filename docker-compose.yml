services:
  postgres:
    image: postgres:16-alpine
    container_name: afh-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: afh
      POSTGRES_PASSWORD: afh_dev_password
      POSTGRES_DB: afh_helper
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afh -d afh_helper"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
