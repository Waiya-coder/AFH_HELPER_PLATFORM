# Render Blueprint: API + PostgreSQL
# Dashboard → New → Blueprint → connect repo with this file.
# Set S3_* and CORS_ORIGINS after first deploy (see docs/DEPLOY.md).

services:
  - type: web
    name: afh-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: afh-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        sync: false

databases:
  - name: afh-postgres
    plan: basic-256mb
    databaseName: afh_helper
    user: afh
